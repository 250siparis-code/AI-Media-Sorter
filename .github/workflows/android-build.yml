name: Android Debug APK Build & Audit CI

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK (JDK 17 & Android SDK 35)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (API 35)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit & Acceptance Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify Android 15 minimum SDK
        run: |
          actual_min_sdk="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest min-sdk app/build/outputs/apk/debug/app-debug.apk)"
          echo "APK minimum SDK: $actual_min_sdk"
          test "$actual_min_sdk" = "35"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMediaSorter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
