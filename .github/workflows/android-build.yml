name: Android Build and Safety Tests
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install decoder fixture generator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Generate isolated decoder fixture
        run: python3 scripts/generate_test_media.py
      - name: Verify standalone transfer executor
        run: python3 -m unittest discover -s tests -v
      - name: Clean build, unit tests, lint and instrumentation compilation
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Inspect generated APK
        run: python3 scripts/inspect_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AIMediaSorter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/apk-inspection.json
  android-device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
            label: '29'
            page_size: 4096
          - api: 35
            target: default
            label: '35'
            page_size: 4096
          - api: 35
            target: google_apis_ps16k
            label: '35-16kb'
            page_size: 16384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install decoder fixture generator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Generate isolated decoder fixture
        run: python3 scripts/generate_test_media.py
      - name: Enable runner KVM access
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedPageSize=${{ matrix.page_size }} --stacktrace
      - name: Capture test logcat
        if: always()
        run: timeout 20s adb logcat -d > android-test-logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports-api-${{ matrix.label }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            android-test-logcat.txt
